<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UBFest - Budget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <a class="back" href="index.html">&larr; Back to UBFest</a>
    <h2 class="title">Budget</h2>

    <div class="grid">
      <div class="card static">Total Budget<small>$15,000,000</small></div>
      <div class="card static">Location<small>Center Stadium</small></div>
      <div class="card static">Stadium Rental<small>$150,000</small></div>
      <div class="card static">Artists<small>$12,000,000</small></div>
    </div>

    <div class="panel" style="margin-top:24px">
      <h3>Breakdown</h3>
      <div class="row"><span>Artists (6 performers)</span><span>$12,000,000</span></div>
      <div class="row"><span>Instruments, venue &amp; stage (combined)</span><span>$2,000,000</span></div>
      <div class="row"><span>Center Stadium rental</span><span>$150,000</span></div>
      <div class="row"><span>Remaining (reserve)</span><span>$850,000</span></div>
      <div class="row total"><span>Total</span><span>$15,000,000</span></div>
    </div>
  </main>
</body>
</html>
